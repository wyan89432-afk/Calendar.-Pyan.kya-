<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>540 Compare Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <h2>540 Compare Table</h2>
        
        <!-- Controls -->
        <div class="controls">
            <button id="addColBtn">+ Column</button>
            <button id="compareBtn">Compare</button>
            <button id="zoomIn">+</button>
            <button id="zoomOut">-</button>
            <button id="zoomReset">Reset</button>
        </div>

        <!-- Fix Table (editable) -->
        <div class="section-title">Fix Table (Editable)</div>
        <div class="table-wrapper" id="fixTableWrapper">
            <table id="fixTable"></table>
        </div>

        <!-- Red comparison table -->
        <div class="section-title">540 Compare Table - Red</div>
        <div class="table-wrapper" id="greenTableWrapper">
            <div class="table-inner-rel">
                <table id="greenTable" class="red-table"></table>
                <svg id="greenSvg" class="arrow-svg"></svg>
            </div>
        </div>

        <!-- Note Section -->
        <div class="section-title">Notes</div>
        <div id="noteSection" class="note-section"></div>

        <!-- Yellow comparison table -->
        <div class="section-title">540 Compare Table - Yellow</div>
        <div class="table-wrapper" id="yellowTableWrapper">
            <div class="table-inner-rel">
                <table id="yellowTable" class="yellow-table"></table>
                <svg id="yellowSvg" class="arrow-svg"></svg>
            </div>
        </div>

        <!-- 560 Red comparison table -->
        <div class="section-title">560 Compare Table - Red</div>
        <div class="table-wrapper" id="red560TableWrapper">
            <div class="table-inner-rel">
                <table id="red560Table" class="red560-table"></table>
                <svg id="red560Svg" class="arrow-svg"></svg>
            </div>
        </div>

        <!-- 560 Yellow comparison table -->
        <div class="section-title">560 Compare Table - Yellow</div>
        <div class="table-wrapper" id="yellow560TableWrapper">
            <div class="table-inner-rel">
                <table id="yellow560Table" class="yellow560-table"></table>
                <svg id="yellow560Svg" class="arrow-svg"></svg>
            </div>
        </div>
    </div>

    <!-- Version query forces GitHub Pages/browser to load the latest files. -->
    <script src="data.js?v=20261005-560"></script>
    <script src="app.js?v=20261005-560"></script>
</body>
</html>
